<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Web</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #121417; color: #e0e0e0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background-color: #1e2228; border: 1px solid #2d323b; padding: 40px; border-radius: 12px; text-align: center; max-width: 400px; width: 90%; }
        h1 { margin-bottom: 10px; font-size: 24px; color: #fff; }
        p { color: #8b95a1; font-size: 14px; margin-bottom: 25px; }
        .btn-link { display: inline-block; width: 100%; padding: 12px; background-color: #20b2aa; color: white; text-decoration: none; border-radius: 8px; font-weight: 600; font-size: 14px; transition: background 0.2s; }
        .btn-link:hover { background-color: #1a9690; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Selamat Datang</h1>
        <p>Silakan buka File Explorer untuk mengelola media kamu.</p>
        <!-- Link navigasi mengarah ke folder /e/ -->
        <a href="./e/" class="btn-link">Buka File Explorer 📁</a>
    </div>
</body>
</html>
